<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Planet -->
  <circle cx="16" cy="15" r="11" fill="url(#planet)" stroke="url(#stroke)" stroke-width="1.5"/>
  <!-- Ring / equator band -->
  <ellipse cx="16" cy="15" rx="11" ry="4" fill="none" stroke="url(#stroke)" stroke-width="1.2" opacity="0.85"/>
  <!-- Small moon or weight dot (hint of "peso") -->
  <circle cx="24" cy="8" r="3" fill="url(#accent)"/>
  <defs>
    <linearGradient id="planet" x1="5" y1="4" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="stroke" x1="5" y1="4" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accent" x1="21" y1="5" x2="27" y2="11" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f472b6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
